<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Wallaby Popcorn</title>
    <link rel="stylesheet" href="find-webclient.css">
</head>
<body>
    <div id="container">
        <img class="logo" src="logo.png" alt="Wallaby Popcorn wallaby with popcorn">
        <h1 class="brand-title">Wallaby Popcorn</h1>
        <p class="brand-subtitle">Your library. Your cinema.</p>
        <form id="connect-form">
            <h1 id="title"></h1>
            <div id="spinner"></div>
            <input type="text" id="address" autofocus>
            <button id="connect-button" type="submit"></button>
        </form>
    </div>
    <script src="find-webclient.lang.js"></script>
    <script src="find-webclient.js"></script>
</html>
