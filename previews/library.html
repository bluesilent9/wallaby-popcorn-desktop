<!doctype html><html lang="en"><meta charset="utf-8"><title>Wallaby Popcorn — library preview</title>
<link rel="stylesheet" href="../native/wallaby-popcorn.css">
<style>
*{box-sizing:border-box}body{margin:0;background:#160d22;color:#fff4d9;font:16px 'Noto Sans',sans-serif}.skinHeader{height:86px;position:sticky;top:0;z-index:10;display:flex;align-items:center;padding:10px 36px;border-bottom:1px solid #382545;gap:34px}.brand{width:240px;height:60px;object-fit:contain}.nav{color:#c5b8ce;display:flex;gap:28px}.nav strong{color:#f6c66a}.headerRight{margin-left:auto;display:flex;align-items:center}main{padding:24px 4vw}h1{font-size:32px;margin:12px 0}.eyebrow{color:#67d6cc;font-size:12px;letter-spacing:2px}.notice{color:#c5b8ce;font-size:12px;margin-left:18px}.toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:24px 0 12px}button,input,select{font:inherit;border-radius:7px;border:1px solid #5c4166;background:#261636;color:#fff4d9;padding:9px 13px}input{width:220px}.itemsContainer{display:flex;flex-wrap:wrap;gap:12px;margin-top:15px}.card{width:160px;cursor:pointer}.cardScalable{position:relative}.cardImageContainer{height:220px;background:#261636}.cardText{padding:6px}.card a{color:inherit;text-decoration:none}.wallaby-cinema-detail{max-height:calc(100vh - 12rem)}.wallaby-cinema-items .cardScalable{display:none}.wallaby-cinema-items .card{padding:17px 18px!important}.wallaby-cinema-name{font-size:17px}.wallaby-cinema-art{width:39%;max-width:190px}.wallaby-cinema-copy h2{font-family:Georgia,serif;font-weight:normal}.wallaby-cinema-detail{padding:26px}.count{color:#c5b8ce;margin-left:auto;font-size:13px}
</style>
<header class="skinHeader"><img class="brand" src="../native/branding/wallaby-popcorn-wordmark-light.svg" alt="Wallaby Popcorn"><nav class="nav"><strong>Home</strong><span>Favourites</span></nav><div class="headerRight"></div></header>
<main class="page"><span class="eyebrow">YOUR LIBRARY. YOUR CINEMA.</span><h1>Movies <span class="notice">DESIGN PREVIEW · Sample titles and metadata</span></h1>
<div class="toolbar"><input id="search" aria-label="Search titles" placeholder="Search this library"><button id="filters">Filters ▾</button><select id="sort" aria-label="Sort order"><option value="Ascending">Title A–Z</option><option value="Descending">Title Z–A</option></select><button id="watched">Unwatched only</button><span class="count" id="count"></span></div>
<div class="itemsContainer"></div></main>
<script>
const names=['The Last Observatory','A Light Across the Water','Beyond the Pines','City of Small Wonders','The Clockmaker’s Journey','Driftwood Days','Echoes of Tomorrow','The Far Side of Summer','A Field Guide to Stars','Golden Hour','The Long Way Home','Midnight at the Harbour','Northbound','Paper Planets','The Quiet Earth'];
const titles=Array.from({length:1250},(_,index)=>({Id:`sample-${index}`,Name:names[index]||`Sample film ${String(index+1).padStart(4,'0')}`,ProductionYear:2024-index%35,Type:'Movie',OfficialRating:'PG',RunTimeTicks:127*600000000,CommunityRating:8.1,Genres:['Adventure','Drama','Science Fiction'],Overview:'On a remote mountain, a young astronomer inherits an abandoned observatory and a notebook filled with impossible predictions. As the winter sky begins to change, she follows a trail of forgotten discoveries — and finds an unexpected connection to the people in the valley below.',People:[{Name:'Alex Morgan',Type:'Actor'},{Name:'Maya Chen',Type:'Actor'},{Name:'Sam Rivera',Type:'Actor'}],OriginalLanguage:'en',MediaSources:[{DefaultAudioStreamIndex:1,MediaStreams:[{Type:'Video',Width:1280,Height:720,Codec:'h264'},{Type:'Audio',Index:1,Codec:'eac3',Channels:6,ChannelLayout:'5.1(side)',BitRate:640000,SampleRate:48000,Language:'jpn'},{Type:'Subtitle',Language:'eng'},{Type:'Subtitle',Language:'rus'}]}],BackdropImageTags:['preview-backdrop'],ImageTags:{Primary:'preview'}}));
let query={ParentId:'preview-movies',IncludeItemTypes:'Movie',Recursive:true,StartIndex:0,Limit:100,SortBy:'SortName',SortOrder:'Ascending',Fields:'ProductionYear'};
window.ApiClient={getCurrentUserId:()=> 'sample-user',serverAddress:()=>location.origin,serverId:()=> 'sample-server',getCurrentUser:async()=>({Policy:{IsAdministrator:true}}),getItem:async(user,id)=>titles.find(item=>item.Id===id),getImageUrl:(id,options)=> options.type==='Backdrop'?'backdrop.svg':'poster.svg',getItems:async(user,q)=>{let items=titles.filter(item=>!q.SearchTerm||item.Name.toLowerCase().includes(q.SearchTerm.toLowerCase()));if(q.SortOrder==='Descending')items.reverse();return {Items:items.slice(q.StartIndex||0,(q.StartIndex||0)+(q.Limit||100)),TotalRecordCount:items.length}}};
async function render(){const result=await ApiClient.getItems('sample-user',query);const list=document.querySelector('.itemsContainer');list.replaceChildren(...result.Items.map(item=>{const card=document.createElement('div');card.className='card';card.dataset.id=item.Id;card.tabIndex=0;const link=document.createElement('a');link.href=`#/details?id=${item.Id}`;link.dataset.action='link';for(const text of [item.Name,String(item.ProductionYear)]){const line=document.createElement('div');line.className='cardText';line.textContent=text;link.append(line)}card.append(link);return card}));document.getElementById('count').textContent=`${result.TotalRecordCount.toLocaleString()} titles · scroll to browse`}
document.getElementById('search').oninput=event=>{query={...query,SearchTerm:event.target.value,StartIndex:0};render()};document.getElementById('sort').onchange=event=>{query={...query,SortOrder:event.target.value,StartIndex:0};render()};document.getElementById('filters').onclick=()=>alert('In the app this is Jellyfin’s existing filter dialog. This preview uses sample data.');document.getElementById('watched').onclick=event=>{event.target.classList.toggle('selected');query={...query,IsPlayed:event.target.classList.contains('selected')?false:undefined};render()};
location.hash='#/movies?topParentId=preview-movies';localStorage.setItem(`wallaby.cinema.${location.origin}.sample-user.preview-movies`,'cinema');
</script>
<script src="../native/wallaby-library-paging.js"></script><script src="../native/wallaby-library.js"></script><script src="../native/wallaby-desktop.js"></script><script>render();</script></html>
