name: Publish desktop source only (no build)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publish verified Development source only; never compile
        shell: bash
        run: |
          set -euo pipefail
          echo 'Source objects only. No CMake, compilation, tests or packaging.'
          base64 -d > /tmp/wallaby-source.bundle <<'BUNDLE'
          
          BUNDLE
          echo '557b3e8ba6ecd08b0cd4e0a1f3925620e98fb2378a84e45d69012c206cee04ce  /tmp/wallaby-source.bundle' | sha256sum -c -
          git bundle verify /tmp/wallaby-source.bundle
          git fetch /tmp/wallaby-source.bundle Development:refs/remotes/source-kit/Development
          expected=61518c1f39cc710e0e7cc9d311020f80f8f0b405
          test "$(git rev-parse refs/remotes/source-kit/Development)" = "$expected"
          test "$(git rev-parse origin/Development)" = feee0300a936fcbf8605cf0a026d34f08b2392c5
          git diff --exit-code origin/Development "$expected" -- .github/workflows
          git merge-base --is-ancestor origin/Development "$expected"
          git push origin "$expected":refs/heads/Development
